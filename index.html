<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>해피해피 코랩</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── 토큰 ─────────────────────────────────────────────── */
:root{
  --paper:#F6F7F8;
  --paper-raised:#FFFFFF;
  --ink:#1C2126;
  --ink-soft:#586170;
  --ink-faint:#8A939F;
  --rule:#E1E4E8;
  --rule-strong:#C9CFD6;
  --tint:rgba(28,33,38,.045);
  --slate:#1D2229;
  --slate-2:#252B33;
  --slate-ink:#E3E7EB;
  --accent:#3A6EA5;
  --accent-soft:#EDF2F7;
  --ok:#2F7A5B;
  --ok-soft:#EAF3EE;
  --bad:#B23B44;
  --bad-soft:#FAECED;
  --run:#8F6516;
  --run-soft:#FAF3E3;

  --t-kw:#C39BD8; --t-str:#8FBF9F; --t-num:#D9A86C; --t-cmt:#7D8794; --t-bi:#7FA8D9;

  --f-sans:'IBM Plex Sans KR',system-ui,-apple-system,sans-serif;
  --f-mono:'IBM Plex Mono','D2Coding','Menlo','Consolas',monospace;
  --gutter:74px;
  --r:3px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--f-sans);font-weight:400;color:var(--ink);
  background-color:var(--paper);
  font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hidden{display:none !important}

/* ── 공용 ─────────────────────────────────────────────── */
.mono{font-family:var(--f-mono)}
.eyebrow{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint)}
.btn{
  font-family:var(--f-mono);font-size:12.5px;letter-spacing:.02em;
  background:var(--paper-raised);border:1px solid var(--rule);border-radius:var(--r);
  padding:7px 13px;color:var(--ink);transition:border-color .12s,background .12s;
}
.btn:hover{border-color:var(--ink-soft)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn-primary:hover{background:#333B45;border-color:#333B45}
.btn-ghost{background:transparent;border-color:transparent;color:var(--ink-soft);padding:6px 8px}
.btn-ghost:hover{color:var(--ink);background:var(--tint);border-color:transparent}
.btn-sm{padding:4px 9px;font-size:11.5px}
.field{width:100%;padding:10px 12px;border:1px solid var(--rule);border-radius:var(--r);background:var(--paper-raised)}
.field:focus{border-color:var(--accent);outline:none}
.card{background:var(--paper-raised);border:1px solid var(--rule);border-radius:var(--r)}

/* ── 시그니처: 실행 거터 ──────────────────────────────── */
.gut{display:grid;grid-template-columns:var(--gutter) 1fr;column-gap:0}
.gut>.g-mark{
  font-family:var(--f-mono);font-size:11.5px;color:var(--ink-faint);
  text-align:right;padding:10px 14px 0 0;white-space:nowrap;
  border-right:1px solid var(--rule);
}
.gut>.g-body{padding:2px 0 2px 20px;min-width:0}
.g-mark.is-run{color:var(--run);animation:pulse 1.1s ease-in-out infinite}
.g-mark.is-ok{color:var(--ok)}
.g-mark.is-bad{color:var(--bad)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.g-mark.is-run{animation:none}}

/* ── 로그인 ───────────────────────────────────────────── */
#login{min-height:100dvh;display:grid;place-items:center;padding:24px}
.login-box{width:100%;max-width:400px}
.login-head{border-left:2px solid var(--ink);padding-left:16px;margin-bottom:34px}
.login-head h1{font-size:26px;font-weight:600;letter-spacing:-.02em;margin:4px 0 2px}
.login-head p{margin:0;color:var(--ink-soft);font-size:13.5px}
.login-form{display:flex;flex-direction:column;gap:10px}
.login-label{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:5px;display:block}
.login-foot{margin-top:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.tiny{font-size:11.5px;color:var(--ink-faint)}
.tiny a{color:var(--ink-faint);text-decoration:underline;text-underline-offset:2px}
.tiny a:hover{color:var(--ink)}
.chk{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-faint);cursor:pointer}
.msg{font-size:12.5px;padding:8px 11px;border-radius:var(--r);margin-top:4px}
.msg-bad{background:var(--bad-soft);color:var(--bad)}
.msg-ok{background:var(--ok-soft);color:var(--ok)}

/* ── 셸 ───────────────────────────────────────────────── */
#app{min-height:100dvh;display:flex;flex-direction:column}
header{
  position:sticky;top:0;z-index:40;background:rgba(246,247,248,.93);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--rule);
}
.hbar{display:flex;align-items:center;gap:14px;padding:10px 20px}
.brand{font-family:var(--f-mono);font-size:12.5px;letter-spacing:.04em;font-weight:500;background:none;border:0;padding:0;color:var(--ink)}
.brand:hover span{color:var(--ink-soft)}
.brand span{color:var(--ink-faint)}
.spacer{flex:1}
.chip{
  font-family:var(--f-mono);font-size:11.5px;padding:4px 9px;border:1px solid var(--rule);
  border-radius:100px;background:var(--paper-raised);display:inline-flex;align-items:center;gap:6px
}
.chip.admin{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.banner{background:var(--run-soft);border-bottom:1px solid #E5D6AE;padding:7px 20px;font-size:12.5px;display:flex;align-items:center;gap:12px}
.banner .mono{font-weight:500}

.layout{flex:1;display:grid;grid-template-columns:262px 1fr;min-height:0}
aside{border-right:1px solid var(--rule);padding:18px 0 40px;overflow-y:auto;max-height:calc(100dvh - 46px);position:sticky;top:46px}
.nav-sec{padding:0 16px;margin-bottom:22px}
.nav-sec h3{margin:0 0 8px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);font-weight:500}
.nav-item{
  display:flex;align-items:baseline;gap:9px;width:100%;text-align:left;
  padding:6px 9px 6px 11px;border:0;border-left:2px solid transparent;background:none;
  border-radius:0 var(--r) var(--r) 0;font-size:13.5px;line-height:1.45;color:var(--ink-soft);
  transition:background .12s,color .12s;
}
.nav-item:hover{background:var(--tint);color:var(--ink)}
.nav-item.active{background:var(--tint);border-left-color:var(--ink);color:var(--ink);font-weight:500}
.nav-item.active .nav-n{color:var(--ink-soft)}
.nav-n{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-faint);flex:none}
.nav-item .dot{width:5px;height:5px;border-radius:50%;background:var(--accent);flex:none;align-self:center}
main{min-width:0;padding:26px 0 90px}
.wrap{max-width:1000px;padding:0 20px}

.page-head{border-bottom:1px solid var(--rule);padding-bottom:14px;margin-bottom:26px}
.page-head h2{margin:6px 0 0;font-size:23px;font-weight:600;letter-spacing:-.02em}
.page-head .sub{color:var(--ink-soft);font-size:13px;margin-top:5px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}

/* ── 노트북 셀 ────────────────────────────────────────── */
.cell{margin:0 0 6px}
.cell-md .g-body{padding-top:2px;padding-bottom:10px}
.md :is(h1,h2,h3,h4){font-weight:600;letter-spacing:-.015em;line-height:1.3;margin:20px 0 8px}
.md h1{font-size:22px} .md h2{font-size:19px} .md h3{font-size:16px} .md h4{font-size:14.5px}
.md p{margin:8px 0} .md ul,.md ol{margin:8px 0;padding-left:22px} .md li{margin:3px 0}
.md code{font-family:var(--f-mono);font-size:.88em;background:var(--accent-soft);color:#2C4C6E;border:1px solid #DDE5EE;padding:.5px 5px;border-radius:2px}
.md pre{background:var(--slate);color:var(--slate-ink);padding:12px 14px;border-radius:var(--r);overflow-x:auto}
.md pre code{background:none;color:inherit;padding:0}
.md blockquote{margin:10px 0;padding-left:14px;border-left:2px solid var(--rule);color:var(--ink-soft)}
.md img{max-width:100%;border-radius:var(--r)}
.md table{border-collapse:collapse;font-size:13px;margin:10px 0}
.md th,.md td{border:1px solid var(--rule);padding:5px 9px;text-align:left}
.md hr{border:0;border-top:1px solid var(--rule);margin:18px 0}

.code-shell{background:var(--slate);border:1px solid #2E353E;border-radius:var(--r);overflow:hidden;position:relative}
.code-shell pre{margin:0;padding:12px 14px;overflow-x:auto;font-family:var(--f-mono);font-size:13px;line-height:1.6;color:var(--slate-ink);tab-size:4}
.code-shell textarea{
  display:block;width:100%;background:var(--slate-2);color:var(--slate-ink);border:0;
  font-family:var(--f-mono);font-size:13px;line-height:1.6;padding:12px 14px;resize:vertical;min-height:64px;tab-size:4;
}
.code-shell textarea:focus{outline:2px solid var(--accent);outline-offset:-2px}
.cell-acts{display:flex;gap:2px;padding:4px 6px;background:rgba(255,255,255,.04);border-top:1px solid rgba(255,255,255,.07)}
.cell-acts .btn{background:transparent;border-color:transparent;color:#A3ACB8;font-size:11.5px;padding:3px 8px}
.cell-acts .btn:hover{background:rgba(255,255,255,.08);color:#fff;border-color:transparent}
.edited-tag{font-family:var(--f-mono);font-size:10px;color:var(--run);margin-left:auto;align-self:center;padding-right:6px}

#ask-fab{position:absolute;z-index:60;display:none;padding:5px 10px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.ch-log{max-height:38vh;overflow:auto;margin:10px 0;display:flex;flex-direction:column;gap:8px}
.ch-msg{padding:8px 11px;border-radius:var(--r);font-size:13.5px;line-height:1.6}
.ch-me{background:rgba(59,47,214,.08);align-self:flex-end;max-width:85%;white-space:pre-wrap}
.ch-ai{background:rgba(22,35,58,.045);max-width:95%}
.ch-ai pre{background:var(--slate);color:var(--slate-ink);padding:10px;border-radius:var(--r);overflow-x:auto}
.ch-ai :is(code,pre){font-family:var(--f-mono);font-size:.88em}
.ch-ai p:first-child{margin-top:0} .ch-ai p:last-child{margin-bottom:0}

.t-kw{color:var(--t-kw)} .t-str{color:var(--t-str)} .t-num{color:var(--t-num)}
.t-cmt{color:var(--t-cmt);font-style:italic} .t-bi{color:var(--t-bi)}

.out{margin-top:9px;font-family:var(--f-mono);font-size:12.5px;line-height:1.55}
.out::before{
  content:'출력';display:block;font-size:10px;letter-spacing:.14em;
  color:var(--ink-faint);margin-bottom:4px;
}
.out.err::before{content:'오류';color:var(--bad)}
.out pre{
  margin:0;white-space:pre-wrap;word-break:break-word;padding:10px 13px;
  background:var(--paper-raised);color:var(--ink);
  border:1px solid var(--rule);border-left:3px solid var(--rule-strong);border-radius:var(--r);
}
.out.err pre{background:var(--bad-soft);border-color:#EFD3D5;border-left-color:var(--bad);color:#8C2F37}
.out img{max-width:100%;background:#fff;border-radius:var(--r);border:1px solid var(--rule);padding:6px}
.out table{border-collapse:collapse;font-size:12px;background:var(--paper-raised)}
.out th,.out td{border:1px solid var(--rule);padding:3px 7px}

/* ── 퀴즈 ─────────────────────────────────────────────── */
.q-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.tag{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;padding:2px 7px;border:1px solid var(--rule);border-radius:100px;color:var(--ink-soft)}
.tag.t-ai{border-color:var(--accent);color:var(--accent)}
.q-stem{font-size:15.5px;line-height:1.6;margin:0 0 14px}
.q-intro{font-size:13.5px;line-height:1.65;color:var(--ink-soft);border-left:2px solid var(--rule);padding:1px 0 1px 13px;margin:0 0 14px}
.q-intro > *:first-child{margin-top:0}
.q-intro > *:last-child{margin-bottom:0}
.q-intro code{font-family:var(--f-mono);font-size:12.5px}
.q-expect{background:var(--ok-soft);border-left:2px solid var(--ok);border-radius:var(--r);padding:10px 13px;margin:0 0 14px}
.q-expect b{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;display:block;margin-bottom:5px;color:var(--ink-soft)}
.q-expect pre{margin:0;font-family:var(--f-mono);font-size:12.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.q-code{background:var(--slate);border-radius:var(--r);padding:12px 14px;overflow-x:auto;margin:0 0 14px}
.q-code pre{margin:0;font-family:var(--f-mono);font-size:13px;line-height:1.6;color:var(--slate-ink);white-space:pre}
.blank{color:var(--run);font-weight:600;background:rgba(176,120,0,.16);padding:0 3px;border-radius:2px}
.opts{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}
.opt{
  display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;
  padding:10px 13px;border:1px solid var(--rule);border-radius:var(--r);background:var(--paper-raised);
}
.opt:hover:not(:disabled){border-color:var(--ink-soft)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt-k{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-faint);flex:none;padding-top:2px}
.opt-t{font-family:var(--f-mono);font-size:13px;line-height:1.5;word-break:break-word;white-space:pre-wrap}
.verdict{padding:12px 14px;border-radius:var(--r);margin:14px 0;font-size:13.5px;line-height:1.6}
.verdict.ok{background:var(--ok-soft);border-left:2px solid var(--ok)}
.verdict.bad{background:var(--bad-soft);border-left:2px solid var(--bad)}
.verdict b{font-family:var(--f-mono);font-size:12.5px;letter-spacing:.04em;display:block;margin-bottom:4px}
.verdict .ans{font-family:var(--f-mono);white-space:pre-wrap;background:var(--paper-raised);border:1px solid var(--rule);padding:6px 9px;border-radius:2px;margin-top:6px;display:block;font-size:12.5px}
.order-pool,.order-picked{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.order-line{
  font-family:var(--f-mono);font-size:12.5px;text-align:left;width:100%;padding:8px 11px;
  border:1px dashed var(--rule-strong);border-radius:var(--r);background:var(--paper-raised);white-space:pre
}
.order-picked .order-line{border-style:solid;border-color:var(--accent);background:var(--accent-soft)}
.progress{height:2px;background:var(--rule);border-radius:2px;overflow:hidden;margin-bottom:20px}
.progress i{display:block;height:100%;background:var(--ink);transition:width .3s}

/* ── 표 / 통계 ────────────────────────────────────────── */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{
  font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);
  text-align:left;font-weight:500;padding:7px 10px;border-bottom:1px solid var(--rule)
}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
.tbl tr:hover td{background:rgba(28,33,38,.03)}
.stat-row{display:flex;gap:26px;flex-wrap:wrap;margin-bottom:22px}
.stat{min-width:78px}
.stat .n{font-family:var(--f-mono);font-size:26px;font-weight:500;letter-spacing:-.02em;line-height:1.1}
.stat .l{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin-top:3px}
.bar{height:4px;background:var(--rule);border-radius:2px;overflow:hidden;width:110px;margin-top:5px}
.bar i{display:block;height:100%;background:var(--ok)}
.empty{padding:44px 20px;text-align:center;color:var(--ink-soft);font-size:13.5px}
.empty .eyebrow{margin-bottom:8px}

/* ── 홈 ───────────────────────────────────────────────── */
.home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-bottom:30px}
.home-card{
  display:block;text-align:left;width:100%;padding:14px 15px;
  background:var(--paper-raised);border:1px solid var(--rule);border-radius:var(--r);
  transition:border-color .12s,box-shadow .12s;
}
.home-card:hover{border-color:var(--rule-strong);box-shadow:0 1px 3px rgba(28,33,38,.06)}
.home-card .t{font-size:14px;font-weight:500;line-height:1.4}
.home-card .d{font-size:12px;color:var(--ink-soft);margin-top:4px;line-height:1.5}
.home-sec{margin-bottom:12px}
.home-sec h3{
  margin:0 0 10px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-faint);font-weight:500;
}

/* ── 모달 ─────────────────────────────────────────────── */
.modal{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:20px;background:rgba(28,33,38,.34)}
.modal-box{width:100%;max-width:460px;background:var(--paper-raised);border:1px solid var(--rule);border-radius:var(--r);padding:22px}
.modal-box h3{margin:0 0 4px;font-size:17px;font-weight:600}
.modal-box .sub{color:var(--ink-soft);font-size:13px;margin-bottom:16px}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.hashout{font-family:var(--f-mono);font-size:11.5px;word-break:break-all;background:var(--slate);color:var(--t-str);padding:10px 12px;border-radius:var(--r);margin-top:10px}

#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{font-family:var(--f-mono);font-size:12.5px;background:var(--ink);color:var(--paper-raised);padding:8px 15px;border-radius:100px}

/* ── PDF 자료실 ───────────────────────────────────────── */
.pdf-pages{display:flex;flex-direction:column;align-items:center;gap:16px;padding-bottom:30px}
.pdf-page{position:relative;box-shadow:0 1px 4px rgba(28,33,38,.12);background:#fff}
.pdf-page canvas{display:block}
.textLayer{
  position:absolute;top:0;left:0;overflow:hidden;opacity:.25;line-height:1;
  text-align:initial;transform-origin:0 0;
}
.textLayer :is(span,br){color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0% 0%}
.textLayer ::selection{background:#8bb4ff}

.menu-btn{display:none}
@media (max-width:860px){
  :root{--gutter:52px}
  .layout{grid-template-columns:1fr}
  aside{position:fixed;inset:46px 0 auto 0;z-index:35;background:var(--paper-raised);max-height:calc(100dvh - 46px);border-right:0;border-bottom:1px solid var(--rule);box-shadow:0 12px 30px rgba(28,33,38,.1)}
  aside.closed{display:none}
  .menu-btn{display:inline-flex}
  .gut>.g-mark{padding-right:9px;font-size:10.5px}
  .gut>.g-body{padding-left:12px}
  .hbar{padding:10px 14px}
  .wrap{padding:0 14px}
}
</style>
</head>
<body>

<!-- ══ 로그인 ══════════════════════════════════════════ -->
<section id="login">
  <div class="login-box">
    <div class="login-head">
      <div class="eyebrow">Colab Notebook Workbench</div>
      <h1>해피해피 코랩</h1>
      <p>수업 노트북을 읽고, 실행하고, 문제로 확인합니다.</p>
    </div>

    <div class="login-form">
      <div>
        <label class="login-label" for="lg-id">아이디</label>
        <input class="field mono" id="lg-id" autocomplete="username" spellcheck="false">
      </div>
      <div>
        <label class="login-label" for="lg-pw">비밀번호</label>
        <input class="field mono" id="lg-pw" type="password" autocomplete="current-password">
      </div>
      <div id="lg-msg"></div>
      <button class="btn btn-primary" id="lg-go" style="padding:11px">로그인</button>
      <button class="btn" id="lg-reg">계정 만들기</button>

/* ════════════════════════════════════════════════════════
   마크다운 + 수식(LaTeX) 렌더링
   마크다운(marked)이 \_, \*, \\ 같은 LaTeX 문법을 강조/이스케이프로
   오해하지 않도록, 수식 구간을 먼저 플레이스홀더로 빼두었다가
   마크다운·새니타이즈가 끝난 뒤 원문 그대로 되돌려 넣는다.
   그 다음 MathJax가 실제 렌더링을 담당한다(코랩과 같은 델리미터 지원). */
const MATH_PATTERNS = [
  /\\begin\{(equation|align|gather|multline|eqnarray)\*?\}[\s\S]*?\\end\{\1\*?\}/g, // $없이 쓰는 환경(코랩 방식)
  /\$\$[\s\S]+?\$\$/g,
  /\\\[[\s\S]+?\\\]/g,
  /\\\([\s\S]+?\\\)/g,
  /\$(?:\\.|[^$\\\n])+?\$/g,
];
function renderMd(src){
  const store=[];
  let out=String(src||'');
  MATH_PATTERNS.forEach(re=>{
    out = out.replace(re, m=>`\uE000${store.push(m)-1}\uE000`);
  });
  let html = DOMPurify.sanitize(marked.parse(out));
  html = html.replace(/\uE000(\d+)\uE000/g, (_,i)=>esc(store[+i]));
  return html;
}

}
const rand = (a,b)=>a+Math.floor(Math.random()*(b-a+1));

const shuffle = a => { const x=[...a]; for(let i=x.length-1;i>0;i--){const j=rand(0,i);[x[i],x[j]]=[x[j],x[i]];} return x; };
const uniq = a => [...new Set(a)];

async function sha256(str){
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}

const PY_KW = ['False','None','True','and','as','assert','async','await','break','class','continue','def','del','elif','else','except','finally','for','from','global','if','import','in','is','lambda','nonlocal','not','or','pass','raise','return','try','while','with','yield'];
const PY_BI = ['print','len','range','int','str','float','list','dict','set','tuple','sum','max','min','abs','round','sorted','enumerate','zip','map','filter','type','input','open','bool','any','all','reversed','isinstance','append','pop','split','join','format','keys','values','items','strip','replace','upper','lower','count','index','insert','remove','extend','sort'];
const HL_RE = new RegExp(
  '(#[^\\n]*)'
+ '|("""[\\s\\S]*?"""|\'\'\'[\\s\\S]*?\'\'\'|"(?:\\\\.|[^"\\\\])*"|\'(?:\\\\.|[^\'\\\\])*\')'
+ '|\\b(\\d+\\.?\\d*(?:[eE][+-]?\\d+)?)\\b'
+ '|\\b(' + PY_KW.join('|') + ')\\b'
+ '|\\b(' + PY_BI.join('|') + ')\\b', 'g');
function hl(code){
  const safe = String(code).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return safe.replace(HL_RE,(m,c,s,n,k,b)=>{
    if(c) return `<span class="t-cmt">${c}</span>`;
    if(s) return `<span class="t-str">${s}</span>`;
    if(n) return `<span class="t-num">${n}</span>`;

    if(b) return `<span class="t-bi">${b}</span>`;

}

/* ════════════════════════════════════════════════════════
   저장소 — Worker 있으면 깃허브, 없으면 이 브라우저
   ════════════════════════════════════════════════════════ */
const hasWorker = () => !!CONFIG.WORKER_URL;
const LKEY = id => `cnb:data:${id}`;

async function api(path, body, method='POST'){
  // /ai 는 별도 서버(AI_URL)로. 나머지는 그대로 Cloudflare Worker로.
  const base = (path==='/ai' && CONFIG.AI_URL) ? CONFIG.AI_URL.replace(/\/ai\/?$/,'') : CONFIG.WORKER_URL;
  const res = await fetch(base.replace(/\/$/,'') + path, {
    method,
    headers:{'content-type':'application/json', ...(S.me?.token?{authorization:'Bearer '+S.me.token}:{})},
    body: method==='GET'?undefined:JSON.stringify(body||{})
  });
  const j = await res.json().catch(()=>({error:'응답을 읽지 못했습니다'}));
  if(res.status===401 && S.me){            // 세션 만료 → 다시 로그인
    localStorage.removeItem('cnb:auto');
    toast('로그인이 만료되었습니다. 다시 로그인해 주세요');
    setTimeout(()=>location.reload(),1200);
  }
  if(!res.ok) throw new Error(j.error||('요청 실패 ('+res.status+')'));
  return j;
}

const Store = {
  async load(id){
    if(hasWorker()){
      try{ const j = await api('/data/get',{user:id}); return j.data || blankData(id); }
      catch(e){ toast('서버에서 불러오지 못했습니다 — 로컬 사본을 씁니다'); }
    }
    try{ return JSON.parse(localStorage.getItem(LKEY(id))) || blankData(id); }
    catch{ return blankData(id); }
  },
  async save(id,data){
    data.updatedAt = new Date().toISOString();
    try{ localStorage.setItem(LKEY(id), JSON.stringify(data)); }catch{}
    if(hasWorker()){
      clearTimeout(Store._t);
      Store._t = setTimeout(()=>api('/data/put',{user:id,data}).catch(e=>toast('서버 저장 실패: '+e.message)), 900);
    }
  }
};
async function persist(){
  if(readOnly()) return;
  await Store.save(S.me.id, S.data);
}

const AKEY = 'cnb:accounts';
const localAccounts = () => { try{ return JSON.parse(localStorage.getItem(AKEY))||{} }catch{ return {} } };
const saveAccounts = a => localStorage.setItem(AKEY, JSON.stringify(a));

/* 비밀번호 원문은 이 함수 밖으로 나가지 않습니다.
   Worker 모드: SHA-256 → 서버에서 SESSION_SECRET을 섞어 HMAC으로 한 번 더 → 그 결과만 저장
   로컬 모드 : SHA-256 결과만 localStorage에 저장 */
async function doAuth(kind, id, pw){
  const h = await sha256(pw);
  if(hasWorker()){
    const j = await api(kind==='login'?'/auth/login':'/auth/register',{id,pw:h});
    return {id:j.id, admin:!!j.admin, token:j.token};
  }
  const accs = localAccounts();
  if(kind==='register'){
    if(accs[id]) throw new Error('이미 있는 아이디입니다');
    accs[id]=h; saveAccounts(accs);
    return {id, admin:id===CONFIG.ADMIN_ID, token:null};
  }
  if(!accs[id]) throw new Error('없는 아이디입니다. 계정을 먼저 만들어 주세요');
  if(accs[id]!==h) throw new Error('아이디 또는 비밀번호가 맞지 않습니다');
  return {id, admin:id===CONFIG.ADMIN_ID, token:null};
}

/* 비밀번호 규칙 — 통과하면 null, 아니면 사유 문자열 */
function pwProblem(id, pw, pw2){
  if(pw.length < CONFIG.MIN_PW_LEN) return `비밀번호는 ${CONFIG.MIN_PW_LEN}자 이상이어야 합니다`;
  if(pw2 !== undefined && pw !== pw2) return '비밀번호와 비밀번호 확인이 서로 다릅니다';
  if(id && pw.toLowerCase().includes(id.toLowerCase())) return '비밀번호에 아이디를 넣지 마세요';
  if(/^(\d+|[a-zA-Z]+)$/.test(pw)) return '숫자와 영문을 섞어 주세요';
  return null;
}

const RAW = p => `https://raw.githubusercontent.com/${CONFIG.GITHUB_OWNER}/${CONFIG.GITHUB_REPO}/${CONFIG.GITHUB_BRANCH}/${p}`;

async function fetchNotebookList(){
  const cacheKey='cnb:nblist';
  try{
    const c=JSON.parse(sessionStorage.getItem(cacheKey));
    if(c && Date.now()-c.t < 6e5) return c.v;
  }catch{}
  const ghList = async () => {
    const url=`https://api.github.com/repos/${CONFIG.GITHUB_OWNER}/${CONFIG.GITHUB_REPO}/contents/${CONFIG.NOTEBOOK_DIR}?ref=${CONFIG.GITHUB_BRANCH}`;
    const r=await fetch(url);

  if(hasWorker()){

    try{ items = (await api('/repo/list',{dir:CONFIG.NOTEBOOK_DIR})).items; }

  sessionStorage.setItem(cacheKey,JSON.stringify({t:Date.now(),v:list}));
  return list;
}

const pdfDocCache = new Map();
async function loadPdfDoc(path){
  if(pdfDocCache.has(path)) return pdfDocCache.get(path);
  const doc = await pdfjsLib.getDocument(RAW(path)).promise;
  pdfDocCache.set(path, doc);
  return doc;
}

const nbCache = new Map();
async function fetchNotebook(path){
  if(nbCache.has(path)) return nbCache.get(path);
  const r = await fetch(RAW(path));
  if(!r.ok) throw new Error('노트북을 불러오지 못했습니다');
  const json = await r.json();
  const cells = (json.cells||[]).map((c,i)=>({
    idx:i,
    type:c.cell_type==='markdown'?'md':'code',
    source: Array.isArray(c.source)?c.source.join(''):(c.source||''),
    outputs: c.outputs||[],
    count: c.execution_count
  }));
  nbCache.set(path,cells);
  return cells;
}

/* 셀 원문: 관리자 공용 편집 → 내 편집 순으로 덮어씀 */
function cellSource(path, cell){
  const shared = S.shared?.edits?.[path]?.[cell.idx];
  const mine   = S.data?.edits?.[path]?.[cell.idx];
  return mine ?? shared ?? cell.source;
}
function cellEditedBy(path, cell){
  if(S.data?.edits?.[path]?.[cell.idx]!=null) return readOnly()?'수정함':'내 수정';
  if(S.shared?.edits?.[path]?.[cell.idx]!=null) return '관리자 수정';
  return null;
}

/* ── 셀 묶음(unit) ────────────────────────────────────────
   코드 셀 하나를, 바로 앞의 마크다운 설명 + 노트북에 저장된 실행 결과와
   한 덩어리로 묶습니다. 문제는 이 덩어리 안에서만 만듭니다.
   그래야 학생이 노트북 전체를 외우지 않아도 화면에 주어진 설명과
   실행 결과만으로 답을 결정할 수 있습니다.
   ──────────────────────────────────────────────────────── */
const plainOutput = outs => (outs||[]).map(o =>
    o.output_type==='stream'  ? [].concat(o.text||[]).join('')
  : o.output_type==='error'   ? ''
  : o.data?.['text/plain']    ? [].concat(o.data['text/plain']).join('')
  : ''
).join('').trim().slice(0,320);

function buildUnits(path, cells){
  const units=[]; let lead=[];
  cells.forEach(c=>{
    const src = cellSource(path, c);
    if(c.type==='md'){ if(src.trim()) lead.push(src.trim()); return; }
    if(src.trim()) units.push({ intro: lead.join('\n\n').trim(), code: src, out: plainOutput(c.outputs) });
    lead=[];
  });
  return units;
}

/* 설명도 실행 결과도 없는 셀에서는 "원래 뭐였는지 외웠는가"밖에 물을 수 없습니다.
   그런 셀은 출제 대상에서 제외합니다. */
const introLen = u => u.intro.replace(/[#*`>\-\s]/g,'').length;
const solvable = u => introLen(u) >= 12 || u.out.length > 0;

/* 실행 결과를 문제와 함께 보여줘도 되는 유형.
   출력 예측·값 계산은 그 출력이 곧 정답이므로 절대 포함하지 않습니다. */
const SHOW_EXPECT = new Set(['blank','order']);
/* 선택지 번호. 기출처럼 5지까지 나올 수 있습니다. */
const OPT_MARK = ['①','②','③','④','⑤','⑥'];

/* ════════════════════════════════════════════════════════
   Pyodide 실행 환경
   ════════════════════════════════════════════════════════ */
const Py = {
  inst:null, loading:null,
  setState(t){ $('#py-state').textContent=t; },
  async get(){
    if(this.inst) return this.inst;
    if(this.loading) return this.loading;
    this.setState('준비 중');
    this.loading = (async()=>{
      await new Promise((res,rej)=>{
        const s=document.createElement('script');
        s.src='https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js';
        s.onload=res; s.onerror=()=>rej(new Error('Python 환경을 내려받지 못했습니다'));
        document.head.appendChild(s);
      });
      const py = await loadPyodide({indexURL:'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/'});
      this.inst=py; this.setState('준비됨');
      return py;
    })();
    try{ return await this.loading; }
    catch(e){ this.setState('실패'); this.loading=null; throw e; }
  },
  /* 코드 한 덩어리 실행 → {out, err, images} */
  async run(code, {fresh=false}={}){
    const py = await this.get();
    const buf=[];
    py.setStdout({batched:s=>buf.push(s)});
    py.setStderr({batched:s=>buf.push(s)});
    try{ await py.loadPackagesFromImports(code); }catch{}
    const ns = fresh ? py.runPython('dict()') : undefined;   // 문제 채점용 격리 네임스페이스
    let err=null, images=[];
    try{
      await py.runPythonAsync(code, ns?{globals:ns}:undefined);
      // matplotlib 그림이 있으면 이미지로 뽑아냅니다
      if(/matplotlib|plt\./.test(code)){
        try{
          const b64 = await py.runPythonAsync(`
import io, base64
try:
    import matplotlib
    matplotlib.use("AGG")
    import matplotlib.pyplot as _plt
    _res=[]
    for _n in _plt.get_fignums():
        _b=io.BytesIO(); _plt.figure(_n).savefig(_b,format="png",dpi=110,bbox_inches="tight")
        _res.append(base64.b64encode(_b.getvalue()).decode())
    _plt.close("all")
    _res
except Exception:
    []
`);
          images = b64 ? b64.toJs() : [];
        }catch{}
      }
    }catch(e){ err = String(e.message||e); }
    finally{ if(ns) ns.destroy?.(); }
    return {out:buf.join(''), err, images};
  }
};

/* ════════════════════════════════════════════════════════
   화면: 노트북
   ════════════════════════════════════════════════════════ */
function renderOutputs(outs){
  if(!outs?.length) return '';
  return outs.map(o=>{
    if(o.output_type==='stream')
      return `<div class="out"><pre>${esc([].concat(o.text||[]).join(''))}</pre></div>`;
    if(o.output_type==='error')
      return `<div class="out err"><pre>${esc((o.traceback||[]).join('\n').replace(/\u001b\[[0-9;]*m/g,''))}</pre></div>`;
    const d=o.data||{};
    if(d['image/png']) return `<div class="out"><img src="data:image/png;base64,${String(d['image/png']).replace(/\s/g,'')}" alt="출력 이미지"></div>`;
    if(d['text/html'])  return `<div class="out">${DOMPurify.sanitize([].concat(d['text/html']).join(''))}</div>`;
    if(d['text/plain']) return `<div class="out"><pre>${esc([].concat(d['text/plain']).join(''))}</pre></div>`;
    return '';
  }).join('');
}

async function runCell(cellEl, cell){
  if(cell.type!=='code') return;
  const mark = cellEl.querySelector('.g-mark');
  const live = cellEl.querySelector('.live');
  const prev = mark.textContent;
  mark.textContent='In [*]:'; mark.className='g-mark is-run';
  live.innerHTML='';
  try{
    const src = cellEl.querySelector('.code-shell textarea')?.value ?? cellSource(S.nb.path,cell);
    const r = await Py.run(src);
    let html='';
    if(r.out) html+=`<div class="out"><pre>${esc(r.out)}</pre></div>`;
    r.images.forEach(b=>html+=`<div class="out"><img src="data:image/png;base64,${b}" alt="그래프"></div>`);
    if(r.err) html+=`<div class="out err"><pre>${esc(r.err)}</pre></div>`;
    if(!html) html=`<div class="out"><pre style="color:var(--ink-faint)">(출력 없음)</pre></div>`;
    live.innerHTML=html;
    mark.textContent=prev; mark.className='g-mark '+(r.err?'is-bad':'is-ok');
  }catch(e){
    live.innerHTML=`<div class="out err"><pre>${esc(e.message)}</pre></div>`;
    mark.textContent=prev; mark.className='g-mark is-bad';
  }
}

function openEditor(cellEl, cell){
  if(readOnly()) return toast('읽기 전용입니다. 내 화면으로 돌아가면 편집할 수 있습니다');
  const shell=cellEl.querySelector('.code-shell');

    <textarea spellcheck="false">${esc(src)}</textarea>
    <div class="cell-acts">
      <button class="btn act-save">저장</button>
      <button class="btn act-run">▶ 실행</button>
      <button class="btn act-cancel">취소</button>
    </div>`;
  const ta=shell.querySelector('textarea');
  ta.style.height=Math.max(64, src.split('\n').length*20.8+26)+'px';
  ta.focus();
  ta.addEventListener('keydown',e=>{
    if(e.key==='Tab'){ e.preventDefault();

}

function downloadNotebook(){

/* ════════════════════════════════════════════════════════
   문제 생성기
   ════════════════════════════════════════════════════════ */
/* 문자열 리터럴을 숫자 없는 표식으로 잠시 치워 둡니다 — 숫자 무작위화가 문자열 안을 건드리지 않도록. */
const DIG='abcdefghij';
const encIdx = n => String(n).replace(/\d/g, d=>DIG[+d]);
const decIdx = s => +s.replace(/[a-j]/g, c=>String(DIG.indexOf(c)));
const maskStrings = src => {
  const store=[];
  const out = src.replace(/("""[\s\S]*?"""|'''[\s\S]*?'''|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')/g, m=>{
    store.push(m); return `\u0001${encIdx(store.length-1)}\u0001`;
  });
  return {out, restore:s=>s.replace(/\u0001([a-j]+)\u0001/g,(_,k)=>store[decIdx(k)])};
};
const BAD_PAT = /(^\s*[!%])|input\s*\(|open\s*\(|import\s+(os|sys|requests|urllib|socket|tensorflow|torch|keras|cv2)|from\s+google|drive\.mount|files\.(upload|download)|while\s+True|time\.sleep|\.read_csv|\.to_csv/m;
function isSelfContained(src){
  if(!src.trim() || src.trim().length<12) return false;
  if(BAD_PAT.test(src)) return false;
  const big = src.match(/range\s*\(\s*(\d{5,})/); if(big) return false;
  if(src.split('\n').filter(l=>l.trim()).length>28) return false;
  return true;
}
function randomizeNumbers(src){
  const {out,restore}=maskStrings(src);
  const changed = out.replace(/(^|[^\w.])(\d+)(?![\w.])/g, (m,pre,d)=>{
    const n=+d;
    if(n<2||n>60) return m;
    return pre + String(Math.min(60,Math.max(2,n+rand(-2,4))));
  });
  return restore(changed);
}

/* 1. 빈칸 채우기 — 설명과 실행 결과를 근거로 답이 정해지는 자리만 비웁니다 */
function genBlank(nb){
  const units = shuffle(nb.units.filter(solvable)
    .filter(u=>u.code.split('\n').filter(l=>l.trim()).length>=2));
  for(const u of units){
    const {out,restore}=maskStrings(u.code);
    /* 문법 키워드(for, in, if...)는 후보에서 뺍니다.
       맥락으로 좁혀지지 않고 결국 암기 문제가 되기 때문입니다. */
    const re=new RegExp('\\b('+PY_BI.join('|')+')\\b','g');
    const cands=[]; let m;
    while((m=re.exec(out))) cands.push({tok:m[1],i:m.index});
    if(!cands.length) continue;
    const hit=pick(cands);
    const others=shuffle(PY_BI.filter(t=>t!==hit.tok && !new RegExp('\\b'+t+'\\b').test(out))).slice(0,3);
    if(others.length<3) continue;
    const blanked=restore(out.slice(0,hit.i)+'____'+out.slice(hit.i+hit.tok.length));
    return {
      type:'빈칸', typeKey:'blank', mode:'mc',
      intro:u.intro, expect:u.out,
      stem: (u.intro && u.out)
        ? '아래 설명을 읽고, 코드가 <span class="mono">실행 결과</span>처럼 동작하도록 빈칸 <span class="blank">____</span> 에 들어갈 것을 고르시오.'
        : u.out
          ? '코드가 아래 <span class="mono">실행 결과</span>처럼 동작하도록 빈칸 <span class="blank">____</span> 에 들어갈 것을 고르시오.'
          : '아래 설명대로 동작하도록 빈칸 <span class="blank">____</span> 에 들어갈 것을 고르시오.',
      code:blanked,
      options:shuffle([hit.tok,...others]),
      answer:hit.tok,
      why:`<span class="mono">${esc(hit.tok)}</span> 입니다. 위 설명과 실행 결과를 보면 이 자리에서 무엇을 해야 하는지 정해집니다.`
    };
  }
  return null;
}

/* 2. 출력 결과 예측 (실제 실행) */
async function genOutput(nb){
  const units = shuffle(nb.units.filter(u=>isSelfContained(u.code))).slice(0,6);
  for(const u of units){
    if(!/print\s*\(/.test(u.code)) continue;
    const code = randomizeNumbers(u.code);
    const r = await Py.run(code,{fresh:true});
    if(r.err || !r.out.trim() || r.out.length>400) continue;
    return {
      type:'출력 예측', typeKey:'output', mode:'text',
      intro:u.intro,
      stem:'다음 코드를 실행했을 때 출력되는 내용을 쓰시오. 숫자는 노트북 원본과 다를 수 있으니 코드를 직접 따라가 보세요.',
      code, answer:r.out.trim(),
      why:'실제로 실행한 결과입니다.'
    };
  }
  return null;
}

/* 3. 변수 값 계산 */
async function genValue(nb){
  const units = shuffle(nb.units.filter(u=>isSelfContained(u.code))).slice(0,6);
  for(const u of units){
    const {out}=maskStrings(u.code);
    const vars = uniq([...out.matchAll(/^\s*([A-Za-z_]\w*)\s*=(?!=)/gm)].map(m=>m[1]))
                 .filter(v=>!['self','_'].includes(v));
    if(!vars.length) continue;
    const v = pick(vars);
    const code = randomizeNumbers(u.code).replace(/\n*$/,'');
    const probe = code.split('\n').filter(l=>!/^\s*print\s*\(/.test(l)).join('\n');
    const r = await Py.run(probe+`\nprint(repr(${v}))`,{fresh:true});
    if(r.err || !r.out.trim() || r.out.length>200) continue;
    return {
      type:'값 계산', typeKey:'value', mode:'text',
      intro:u.intro,
      stem:`다음 코드를 끝까지 실행한 뒤 변수 <span class="mono blank">${esc(v)}</span> 의 값은? 숫자는 노트북 원본과 다를 수 있습니다.`,
      code:probe, answer:r.out.trim(),
      why:`<span class="mono">print(repr(${esc(v)}))</span> 를 붙여 실제로 확인한 값입니다.`
    };
  }
  return null;
}

/* 4. 개념 — 마크다운의 코드 표기(`...`)된 이름만 후보로 씁니다.

   예전 방식은 제목과 굵은 글씨까지 후보에 넣었습니다. 그래서
   '파이썬 넘파이(NumPy) 심화' 같은 섹션 제목이 선택지로 나왔고,
   표 안에서 백틱 짝이 어긋나면 '는 행 인덱스,' 같은 한국어 조각도
   용어로 잡혔습니다. 게다가 문장을 제목에서 떼어내 출제하니
   무엇에 대한 설명인지 알 수 없었습니다.

   지금은 (1) 함수·속성 이름 모양인 것만 후보로 두고,
   (2) 그런 후보가 넷 미만이면 아예 문항을 만들지 않으며,
   (3) 그 문장이 속한 제목을 함께 보여 줍니다. */
const IDENT_RE = /^[A-Za-z_][A-Za-z0-9_]*(\.[A-Za-z_][A-Za-z0-9_]*)*(\(\))?$/;

/* 제목 앞에 붙은 목차 번호를 떼어냅니다.
   '1)Numpy 특징' → 'Numpy 특징', '(5) 넘파이 모듈의 함수 특징' → '넘파이 모듈의 함수 특징',
   '① arange 함수로 생성하기' → 'arange 함수로 생성하기'.
   번호는 문서 안에서만 뜻이 있고 문제에서는 잡음입니다. */
const HEAD_NUM = /^\s*(?:[\u2460-\u2473\u3251-\u325F]|\(\s*\d+\s*\)|\d+\s*[).]|[가나다라마바사아자차카타파하]\s*[).])\s*/;
function cleanHead(h){
  let t = String(h).replace(/[`*_#]/g,'').trim();
  for(let i=0;i<3 && HEAD_NUM.test(t);i++) t = t.replace(HEAD_NUM,'');
  return t.trim();
}

/* 제목과 그 아래 설명을 묶어 맥락을 유지합니다. */
function mdSections(nb){
  const out=[];
  for(const cell of nb.mdCells){
    let head='';
    for(const raw of cell.split('\n')){
      const h = raw.match(/^#{1,6}\s*(.+?)\s*$/);
      if(h){ head = cleanHead(h[1]); continue; }
      if(/^\s*\|/.test(raw)) continue;              // 표는 문장이 아니므로 건너뜁니다
      const body = raw.replace(/^[\s>*+\-]+/,'').trim();
      if(body.length>18 && body.length<220) out.push({head, body});
    }
  }
  return out;
}

function genConcept(nb){
  const terms = uniq(nb.mdCells.flatMap(t =>
      [...t.matchAll(/`([^`\n]+)`/g)].map(m=>m[1].trim())
    )).filter(t => t.length>=3 && IDENT_RE.test(t));
  if(terms.length<4) return null;                   // 후보가 모자라면 만들지 않습니다

  const clean = x => x.replace(/[`*_>#]/g,'').trim();
  for(const sec of shuffle(mdSections(nb))){
    const hit = terms.find(t => sec.body.includes(t) && clean(sec.body.split(t).join('')).length>14);
    if(!hit) continue;
    const others = shuffle(terms.filter(o => o!==hit && !sec.body.includes(o))).slice(0,3);
    if(others.length<3) continue;
    return {
      type:'개념', typeKey:'concept', mode:'mc',
      intro: sec.head ? `다음은 **${sec.head}** 에 대한 설명이다.` : '',
      stem:`다음 설명의 빈칸에 들어갈 것으로 알맞은 것은?<br><span style="display:block;margin-top:9px;padding:9px 12px;background:var(--paper-raised);border:1px solid var(--rule);border-left:3px solid var(--rule-strong);border-radius:var(--r)">${esc(clean(sec.body).split(hit).join('____'))}</span>`,
      options: shuffle([hit, ...others]),
      answer: hit,
      why:`노트북 설명 부분에서 <span class="mono">${esc(hit)}</span> 를 다룬 문장입니다.`
    };
  }
  return null;
}

/* 5. 줄 순서 맞추기 */
function genOrder(nb){
  for(const u of shuffle(nb.units.filter(solvable))){
    const lines=u.code.split('\n').filter(l=>l.trim() && !/^\s*#/.test(l));
    if(lines.length<3 || lines.length>6) continue;
    if(new Set(lines).size!==lines.length) continue;
    return {
      type:'순서', typeKey:'order', mode:'order',
      intro:u.intro, expect:u.out,
      stem: u.out
        ? '아래 <span class="mono">실행 결과</span>가 나오도록 줄을 순서대로 배열하시오.'
        : '위 설명대로 동작하도록 줄을 순서대로 배열하시오.',
      lines, answer:lines.join('\n'),
      why:'변수는 쓰이기 전에 정의돼야 하고, 출력은 계산이 끝난 뒤에 옵니다.'
    };
  }
  return null;
}

/* ════════════════════════════════════════════════════════
   AI 서술형 문제 보관
   AI가 만든 문제를 한 번 쓰고 버리지 않고 모아 둡니다.

   학생은 공용 데이터에 쓸 수 없으므로(서버가 관리자만 허용),
   학생이 푸는 동안 생긴 문제는 각자 데이터에 '초안'으로 쌓입니다.
   관리자가 검토해서 승인하면 공용 은행으로 올라가고,
   그때부터는 새로 만들지 않고 그 문제를 다시 출제합니다.
   채점은 답안이 매번 다르므로 계속 AI가 합니다.
   ════════════════════════════════════════════════════════ */

/* 같은 문제가 여러 학생에게서 올라와도 하나로 묶으려고 문제 글로 id를 만듭니다. */
function essayId(question){
  const t = String(question||'').replace(/\s+/g,' ').trim();
  let h = 0;
  for(let i=0;i<t.length;i++){ h = (h*31 + t.charCodeAt(i)) | 0; }
  return 'e' + (h>>>0).toString(36) + '_' + t.length;
}

function essayBank(){
  if(!S.shared) return [];
  if(!Array.isArray(S.shared.essayBank)) S.shared.essayBank = [];
  return S.shared.essayBank;
}
function essayRejected(){
  if(!S.shared) return [];
  if(!Array.isArray(S.shared.essayRejected)) S.shared.essayRejected = [];
  return S.shared.essayRejected;
}
function essayDrafts(){
  if(!S.data) return [];
  if(!Array.isArray(S.data.essayDrafts)) S.data.essayDrafts = [];
  return S.data.essayDrafts;
}

function essaySaveDraft(nbName, j, intro){
  const id = essayId(j.question);
  if(essayBank().some(x=>x.id===id)) return;        // 이미 승인된 문제
  if(essayRejected().includes(id)) return;          // 관리자가 이미 버린 문제
  const d = essayDrafts();
  if(d.some(x=>x.id===id)) return;
  d.push({id, nb:nbName, question:j.question, code:j.code||'',
          rubric:j.rubric||'', answer:j.model_answer||'', intro:intro||'',
          at:Date.now()});
  if(d.length>60) d.splice(0, d.length-60);         // 무한정 쌓이지 않게
  persist().catch(()=>{});
}

/* 승인된 문제 중 이 노트북 것을 골라 옵니다. */
function essayFromBank(nbName, count){
  const pool = essayBank().filter(x=>nbMatches(x.nb, nbName));
  return shuffle(pool).slice(0, count).map(x=>({
    type:'서술형', typeKey:'essay', mode:'essay', ai:true, fromBank:true,
    intro:x.intro||'', stem:esc(x.question), code:x.code||'',
    rubric:x.rubric||'', answer:x.answer||'', why:'AI 채점 결과입니다.'
  }));
}

/* 6. 서술형 (Claude API, Worker 필요) — 노트북 전체가 아니라 덩어리 하나만 넘깁니다 */
async function genEssay(nb){
  if(!hasWorker()) return null;
  const rich = nb.units.filter(u=>introLen(u)>25);
  const u = pick(rich.length?rich:nb.units.filter(solvable));
  if(!u) return null;
  const ctx = `${u.intro}\n\n\`\`\`python\n${u.code.slice(0,1200)}\n\`\`\``
            + (u.out?`\n\n실행 결과:\n${u.out}`:'');
  const j = await api('/ai',{task:'make', notebook:nb.name, context:ctx});
  if(!j.question) return null;
  essaySaveDraft(nb.name, j, u.intro);   // 한 번 쓰고 버리지 않고 초안으로 남깁니다
  return {
    type:'서술형', typeKey:'essay', mode:'essay', ai:true,
    intro:u.intro,
    stem:esc(j.question), code:j.code||'', rubric:j.rubric||'', answer:j.model_answer||'',
    why:'AI 채점 결과입니다.'
  };
}

/* 노트북 내용에서 즉석으로 만드는 문항. 은행이 모자랄 때만 씁니다. */
async function buildGenerated(nb, count){
  const gens = [
    ()=>genBlank(nb), ()=>genConcept(nb), ()=>genOrder(nb),
    ()=>genOutput(nb), ()=>genValue(nb),
  ];
  const tryGen = async f => { try{ return await f(); }catch{ return null; } };
  const out=[]; const seen=new Set();
  let guard=0;
  while(out.length<count && guard++ < count*6){
    const q = await tryGen(gens[out.length % gens.length]) || await tryGen(pick(gens));
    if(!q) continue;
    const key=(q.typeKey+'|'+(q.code||'')+'|'+q.answer).slice(0,300);
    if(seen.has(key)) continue;
    seen.add(key); out.push(q);
  }
  return out;
}


/* ════════════════════════════════════════════════════════
   문항 은행 — bank/ 폴더에 미리 만들어 둔 문항을 씁니다.
   유형(개념 분류·빈칸·경계값·상태 예측·대조·조건 매핑·서답형)마다
   골고루 뽑아서 내고, 모자라면 위의 생성기로 채웁니다.
   ════════════════════════════════════════════════════════ */
const BANK = { loaded:false, types:[], questions:[] };

async function loadBank(){
  if(BANK.loaded) return BANK;
  BANK.loaded = true;
  for(const f of (CONFIG.BANK_FILES||[])){
    try{
      const r = await fetch(RAW(f), {cache:'no-cache'});
      if(!r.ok) continue;
      const j = await r.json();
      if(!BANK.types.length) BANK.types = j.types||[];
      BANK.questions.push(...(j.questions||[]));
    }catch{ /* 은행이 없어도 생성기로 그대로 동작합니다 */ }
  }
  return BANK;
}

/* '1_넘파이_기초(개념)' 과 '1_넘파이_기초_개념_' 처럼
   괄호·밑줄만 다른 이름도 같은 노트북으로 봅니다. */
const bankKey = s => String(s||'').replace(/\.ipynb$/,'')
  .replace(/[^0-9A-Za-z가-힣]/g,'').toLowerCase();
function nbMatches(x, y){
  const a=bankKey(x), b=bankKey(y);
  return !!a && !!b && (a===b || a.startsWith(b) || b.startsWith(a));
}

/* 유형별 배분. 문항 수가 적으면 유형마다 1개씩, 늘어나면 상한까지.
   한 바퀴마다 순서를 섞습니다. 고정 순서로 두면 문항 수가 적을 때
   늘 뒤쪽 유형만 빠지고 남는 문항도 앞쪽 유형에만 몰립니다. */
function bankAllocate(types, n, avail){
  const alloc={}; types.forEach(t=>{alloc[t.key]=0;});
  const live = types.filter(t=>(avail[t.key]||0)>0);
  if(!live.length) return alloc;
  const total = ()=>live.reduce((s,t)=>s+alloc[t.key],0);
  const fill = capOf => {
    let guard=0;
    while(total()<n && guard++<400){
      let moved=false;
      for(const t of shuffle(live)){
        if(total()>=n) break;
        if(alloc[t.key] < Math.min(capOf(t), avail[t.key])){ alloc[t.key]++; moved=true; }
      }
      if(!moved) break;
    }
  };
  fill(t=>(t.pick&&t.pick[0])||1);   // 유형마다 최소치
  fill(t=>(t.pick&&t.pick[1])||2);   // 유형별 상한까지
  fill(()=>Infinity);                // 그래도 모자라면 남는 만큼
  return alloc;
}

/* 최근에 낸 문항은 뒤로 미뤄 같은 문제가 연달아 나오지 않게 합니다. */
function pickFromBank(nbName, count){
  const recent = new Set(S.data?.quiz?.recentBank || []);
  const pool = BANK.questions.filter(q=>nbMatches(q.src, nbName));
  if(!pool.length) return [];
  const byType={};
  for(const q of pool) (byType[q.typeKey] ||= []).push(q);
  const avail={};
  for(const k in byType) avail[k]=byType[k].length;
  const types = BANK.types.length ? BANK.types : Object.keys(byType).map(k=>({key:k}));
  const alloc = bankAllocate(types, count, avail);

  const out=[];
  for(const t of types){
    const want = alloc[t.key]||0;
    if(!want) continue;
    const fresh = shuffle(byType[t.key].filter(q=>!recent.has(q.id)));
    const seen  = shuffle(byType[t.key].filter(q=> recent.has(q.id)));
    out.push(...[...fresh,...seen].slice(0,want));
  }
  return out;
}

/* 출제 직전 정답 재검증. CONFIG.BANK_VERIFY 가 true 일 때만 돕니다.
   파이썬을 못 쓰는 상황이면 그냥 통과시킵니다. */
async function verifyBankQuestion(q){
  if(!CONFIG.BANK_VERIFY || !q.verifyCode) return true;
  try{
    const r = await Py.run('import numpy as np\n'+q.verifyCode, {fresh:true});
    if(r.err) return false;
    return r.out.trim() === String(q.verifyExpect||'').trim();
  }catch{ return true; }
}

/* 서답형 채점 — 공백과 따옴표 차이는 무시하고 accept 목록도 정답으로 봅니다. */
const bankNorm = s => String(s ?? '').replace(/\s+/g,'')
  .replace(/[\u2018\u2019\u201C\u201D'`]/g,'"').replace(/^\.+/,'').toLowerCase();
function acceptsAnswer(q, mine){
  const m = bankNorm(mine);
  if(!m) return false;
  return [q.answer, ...(q.accept||[])].map(bankNorm).includes(m);
}

function rememberBankIds(qs){
  if(!S.data?.quiz) return;
  const ids = qs.filter(q=>q.id).map(q=>q.id);
  if(!ids.length) return;
  const prev = S.data.quiz.recentBank || [];
  S.data.quiz.recentBank = [...ids, ...prev.filter(x=>!ids.includes(x))].slice(0,40);
}

/* 은행을 먼저 쓰고, 모자라는 만큼만 생성기로 채웁니다. */
async function buildQuiz(nb, count){
  await loadBank();
  let picked = pickFromBank(nb.name, count);

  if(CONFIG.BANK_VERIFY && picked.length){
    const checked=[];
    for(const q of picked) if(await verifyBankQuestion(q)) checked.push(q);
    picked = checked;
  }
  rememberBankIds(picked);

  const need = count - picked.length;
  if(need > 0){
    try{ picked.push(...await buildGenerated(nb, need)); }
    catch(e){ console.warn('생성기 실패 — 은행 문항만으로 진행합니다:', e); }
  }
  return picked;
}

async function startQuiz(){
  const path=$('#qz-nb').value, n=+$('#qz-n').value, useAI=$('#qz-ai').checked;
  const meta=S.notebooks.find(x=>x.path===path);
  $('#view').innerHTML=`<div class="empty"><div class="eyebrow">Generating</div>문제를 만드는 중입니다…</div>`;
  try{
    const cells = await fetchNotebook(path);
    const nb = {
      name:meta.name, path,
      units: buildUnits(path, cells),
      codeCells: cells.filter(c=>c.type==='code').map(c=>cellSource(path,c)).filter(s=>s.trim()),
      mdCells:  cells.filter(c=>c.type==='md').map(c=>cellSource(path,c)).filter(s=>s.trim()),
    };
    if(!nb.units.length && !nb.mdCells.length) throw new Error('이 노트북에는 문제로 만들 내용이 없습니다');
    if(!nb.units.some(solvable) && !nb.mdCells.length)
      throw new Error('이 노트북은 코드에 설명이나 실행 결과가 없어 문제를 만들 수 없습니다');
    await Py.get().catch(()=>{});
    let qs = await buildQuiz(nb, useAI?Math.max(1,n-2):n);
    if(useAI){
      const need = 2;
      // 관리자가 승인해 둔 문제를 먼저 씁니다. AI 호출이 줄고 품질도 검증된 것만 나갑니다.
      const reused = essayFromBank(nb.name, need);
      qs.push(...reused);
      for(let i=reused.length;i<need;i++){
        try{ const e=await genEssay(nb); if(e) qs.push(e); }
        catch(err){ toast('서술형 생성 실패: '+err.message); break; }
      }
    }
    if(!qs.length) throw new Error('문제를 만들지 못했습니다. 다른 노트북을 골라 보세요');
    QZ={nb, qs:shuffle(qs), i:0, picked:null, order:[], graded:false, right:0};
    renderQuestion();
  }catch(e){
    $('#view').innerHTML=`<div class="empty"><div class="eyebrow">Error</div>${esc(e.message)}<div style="margin-top:14px"><button class="btn" onclick="location.reload()">새로고침</button></div></div>`;
  }
}

function renderQuestion(){
  const q=QZ.qs[QZ.i], el=$('#view');
  const pct=Math.round(QZ.i/QZ.qs.length*100);
  el.innerHTML=`
    <div class="progress"><i style="width:${pct}%"></i></div>
    <div class="gut">
      <div class="g-mark">Q [${QZ.i+1}/${QZ.qs.length}]</div>
      <div class="g-body">
        <div class="q-meta">
          <span class="tag${q.ai?' t-ai':''}">${esc(q.type)}</span>
          <span class="tag">${esc(QZ.nb.name)}</span>
        </div>
        ${q.intro?`<div class="q-intro">${renderMd(q.intro)}</div>`:''}
        <p class="q-stem">${q.stem}</p>
        ${q.code?`<div class="q-code"><pre>${hl(q.code)}</pre></div>`:''}
        ${(q.expect && SHOW_EXPECT.has(q.typeKey))?`<div class="q-expect"><b>실행 결과</b><pre>${esc(q.expect)}</pre></div>`:''}
        <div id="q-input"></div>
        <div id="q-verdict"></div>
        <div class="row" style="justify-content:flex-start">
          <button class="btn btn-primary" id="q-submit">제출</button>
          <button class="btn hidden" id="q-next">다음</button>
          <button class="btn btn-ghost btn-sm" id="q-quit">그만두기</button>
        </div>
      </div>
    </div>`;
  typesetMath(el);

  const box=$('#q-input');
  if(q.mode==='mc'){
    box.innerHTML=`<div class="opts">${q.options.map((o,i)=>
      `<button class="opt" data-o="${escAttr(o)}"><span class="opt-k">${OPT_MARK[i]||(i+1)}</span><span class="opt-t">${esc(o)}</span></button>`).join('')}</div>`;
    box.onclick=e=>{ const b=e.target.closest('.opt'); if(!b||QZ.graded) return;
      $$('.opt',box).forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); QZ.picked=b.dataset.o; };
  }else if(q.mode==='text'){
    box.innerHTML=`<textarea class="field mono" id="q-text" rows="3" spellcheck="false" placeholder="답을 입력하세요"></textarea>`;
  }else if(q.mode==='essay'){
    box.innerHTML=`<textarea class="field" id="q-text" rows="5" placeholder="문장으로 설명해 보세요"></textarea>`;
  }else if(q.mode==='order'){
    QZ.order=[];
    box.innerHTML=`<div class="eyebrow" style="margin-bottom:6px">고른 순서</div><div class="order-picked" id="op"></div>
      <div class="eyebrow" style="margin:12px 0 6px">보기</div><div class="order-pool" id="ol"></div>`;
    const pool=shuffle(q.lines);
    const draw=()=>{
      $('#op').innerHTML=QZ.order.map((l,i)=>`<button class="order-line" data-r="${i}">${esc(l)}</button>`).join('')||`<div class="tiny">아래에서 순서대로 고르세요</div>`;
      $('#ol').innerHTML=pool.filter(l=>!QZ.order.includes(l)).map(l=>`<button class="order-line" data-a="${escAttr(l)}">${esc(l)}</button>`).join('');
    };
    box.onclick=e=>{ if(QZ.graded) return;
      const a=e.target.closest('[data-a]'), r=e.target.closest('[data-r]');
      if(a){ QZ.order.push(a.dataset.a); draw(); }
      if(r){ QZ.order.splice(+r.dataset.r,1); draw(); }
    };
    draw();
  }
  $('#q-submit').onclick=grade;
  $('#q-next').onclick=()=>{ QZ.i++; QZ.picked=null; QZ.graded=false;
    if(QZ.i>=QZ.qs.length) finishQuiz(); else renderQuestion(); };
  $('#q-quit').onclick=()=>{ QZ=null; setView('quiz'); };
}

const norm = s => String(s).replace(/\r/g,'').replace(/[ \t]+/g,' ').replace(/\s+$/gm,'').trim();

async function grade(){
  if(QZ.graded) return;
  const q=QZ.qs[QZ.i];
  let mine, ok, feedback='';

  if(q.mode==='mc'){
    if(!QZ.picked) return toast('보기를 하나 고르세요');
    mine=QZ.picked; ok = mine===q.answer;
    $$('.opt').forEach(b=>{ b.disabled=true;
      if(b.dataset.o===q.answer) b.classList.add('right');
      else if(b.dataset.o===mine) b.classList.add('wrong'); });
  }else if(q.mode==='order'){
    mine=QZ.order.join('\n'); ok = mine===q.answer;
    if(!QZ.order.length) return toast('순서를 먼저 고르세요');
  }else if(q.mode==='text'){
    mine=$('#q-text').value; if(!mine.trim()) return toast('답을 입력하세요');
    ok = norm(mine)===norm(q.answer) || acceptsAnswer(q, mine);
  }else{ /* essay */
    mine=$('#q-text').value; if(!mine.trim()) return toast('답을 입력하세요');
    $('#q-submit').disabled=true; $('#q-submit').textContent='채점 중…';
    try{
      const j=await api('/ai',{task:'grade',question:q.stem,rubric:q.rubric,answer:mine});
      ok=!!j.correct; feedback=j.feedback||''; q.answer=j.model_answer||q.answer;
    }catch(e){ $('#q-submit').disabled=false; $('#q-submit').textContent='제출'; return toast('채점 실패: '+e.message); }
  }

  QZ.graded=true;
  if(ok) QZ.right++;
  $('#q-verdict').innerHTML=`
    <div class="verdict ${ok?'ok':'bad'}">
      <b>${ok?'맞았습니다':'틀렸습니다'}</b>
      ${feedback?esc(feedback)+'<br>':''}
      ${ok?'':`정답<span class="ans">${esc(q.answer)}</span>`}
      <div style="margin-top:7px;color:var(--ink-soft);font-size:12.5px">${q.why}</div>
    </div>`;
  $('#q-submit').classList.add('hidden'); $('#q-next').classList.remove('hidden'); $('#q-next').focus();

  await record(q, mine, ok);
}

async function record(q, mine, ok){
  if(readOnly()) return;
  const path = q.path || QZ.nb.path;
  const nbName = q.nb || QZ.nb.name;
  const st=S.data.quiz.stats[path]||(S.data.quiz.stats[path]={asked:0,correct:0});
  st.asked++; if(ok) st.correct++;
  S.data.quiz.attempts.push({t:Date.now(),path,type:q.typeKey,ok});
  if(S.data.quiz.attempts.length>800) S.data.quiz.attempts.splice(0,200);

  const key = await sha256(q.typeKey+'|'+(q.code||'')+'|'+q.answer);
  const idx = S.data.wrong.findIndex(w=>w.key===key);
  if(ok){
    if(idx>=0){ S.data.wrong[idx].streak=(S.data.wrong[idx].streak||0)+1;
      if(S.data.wrong[idx].streak>=2) S.data.wrong.splice(idx,1); }
  }else{
    const entry={key,path,nb:nbName,type:q.type,typeKey:q.typeKey,stem:q.stem,code:q.code||'',
      intro:q.intro||'',expect:q.expect||'',
      options:q.options||null,answer:q.answer,accept:q.accept||null,
      mine,why:q.why,at:Date.now(),streak:0};
    if(idx>=0) S.data.wrong[idx]=entry; else S.data.wrong.push(entry);
  }
  await persist(); updateWrongDot();
}

function updateWrongDot(){ $('#wrong-dot').classList.toggle('hidden', !(S.data?.wrong?.length)); }

function viewWrong(){
  const list=[...(S.data.wrong||[])].sort((a,b)=>b.at-a.at);
  $('#view').innerHTML=`
    <div class="page-head">
      <div class="eyebrow">Error Log</div>
      <h2>오답 노트</h2>
      <div class="sub">틀린 문제는 여기에 남습니다. 두 번 연속 맞히면 목록에서 사라집니다.</div>
      ${list.length?`<div class="toolbar"><button class="btn btn-primary" id="w-retry">오답만 다시 풀기 (${list.length})</button>
        <button class="btn btn-ghost btn-sm" id="w-export">내보내기</button>
        <button class="btn btn-ghost btn-sm" id="w-import">불러오기</button></div>`:''}
    </div>
    <div id="w-list">${list.length?'':`<div class="empty"><div class="eyebrow">Empty</div>아직 틀린 문제가 없습니다. 문제를 풀면 여기에 쌓입니다.</div>`}</div>`;

  const host=$('#w-list');
  list.forEach((w,i)=>{
    const d=document.createElement('div'); d.className='gut'; d.style.marginBottom='18px';
    d.innerHTML=`
      <div class="g-mark is-bad">Err[${list.length-i}]</div>
      <div class="g-body">
        <div class="q-meta"><span class="tag">${esc(w.type)}</span><span class="tag">${esc(w.nb)}</span>
          ${w.streak?`<span class="tag" style="border-color:var(--ok);color:var(--ok)">연속 ${w.streak}</span>`:''}</div>
        ${w.intro?`<div class="q-intro">${renderMd(w.intro)}</div>`:''}
        <p class="q-stem" style="font-size:14.5px">${w.stem}</p>
        ${w.code?`<div class="q-code"><pre>${hl(w.code)}</pre></div>`:''}
        ${(w.expect && SHOW_EXPECT.has(w.typeKey))?`<div class="q-expect"><b>실행 결과</b><pre>${esc(w.expect)}</pre></div>`:''}
        <div class="verdict bad" style="margin-top:0">
          <b>내가 쓴 답</b><span class="ans">${esc(w.mine||'(무응답)')}</span>
          <div style="margin-top:8px"><b>정답</b><span class="ans">${esc(w.answer)}</span></div>
        </div>
        <button class="btn btn-ghost btn-sm" data-del="${escAttr(w.key)}">이 문제 지우기</button>
      </div>`;
    host.appendChild(d);
  });
  typesetMath(host);

  host.onclick=async e=>{
    const b=e.target.closest('[data-del]'); if(!b) return;
    if(readOnly()) return toast('읽기 전용입니다');
    S.data.wrong=S.data.wrong.filter(w=>w.key!==b.dataset.del);
    await persist(); updateWrongDot(); viewWrong();
  };
  if(!list.length) return;

  $('#w-retry').onclick=()=>{
    const qs=list.map(w=>({type:w.type,typeKey:w.typeKey,mode:w.options?'mc':(w.typeKey==='order'?'order':'text'),
      stem:w.stem,code:w.code,intro:w.intro||'',expect:w.expect||'',
      options:w.options,answer:w.answer,accept:w.accept||null,why:w.why,
      path:w.path,nb:w.nb,
      lines:w.typeKey==='order'?w.answer.split('\n'):undefined}));
    QZ={nb:{name:'오답 노트',path:list[0].path},qs:shuffle(qs),i:0,picked:null,order:[],graded:false,right:0};
    S.view='quiz'; markNav(); renderQuestion();
  };
  $('#w-export').onclick=()=>{
    const url=URL.createObjectURL(new Blob([JSON.stringify(S.data,null,2)],{type:'application/json'}));
    const a=document.createElement('a');a.href=url;a.download=`${S.data.user}-학습기록.json`;a.click();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  };
  $('#w-import').onclick=()=>{
    if(readOnly()) return toast('읽기 전용입니다');
    const f=document.createElement('input');f.type='file';f.accept='.json';
    f.onchange=async()=>{
      try{
        const j=JSON.parse(await f.files[0].text());
        if(!j.wrong||!j.quiz) throw new Error('형식이 맞지 않습니다');
        S.data.wrong=j.wrong; S.data.quiz=j.quiz; S.data.edits={...j.edits,...S.data.edits};
        await persist(); toast('불러왔습니다'); viewWrong(); updateWrongDot();
      }catch(e){ toast('불러오지 못했습니다: '+e.message); }
    };
    f.click();
  };
}

async function viewEssayAdmin(){

    <div class="sub">AI가 만든 서술형 문제를 검토합니다. 승인하면 다음부터 새로 만들지 않고 이 문제를 다시 냅니다.
      채점은 답안이 매번 다르므로 계속 AI가 합니다.</div></div>
    <div id="es-body"><div class="empty">불러오는 중…</div></div>`;

  const body=$('#es-body');

  // 학생들이 각자 데이터에 쌓아 둔 초안을 모읍니다.
  let drafts=[];
  try{
    let users=[];
    if(hasWorker()) users=(await api('/users',{})).users;
    else users=Object.keys(localAccounts()).map(id=>({id}));
    const loaded = await Promise.all(users.map(u =>
      Store.load(u.id).then(d=>({id:u.id, d})).catch(()=>({id:u.id, d:null}))));
    for(const {id,d} of loaded)
      for(const x of (d?.essayDrafts||[])) drafts.push({...x, by:id});
  }catch(e){ body.innerHTML=`<div class="empty">${esc(e.message)}</div>`; return; }

  const bank=essayBank(), rejected=essayRejected();
  const seen=new Set();
  drafts = drafts.filter(x=>{
    if(bank.some(b=>b.id===x.id)) return false;      // 이미 승인됨
    if(rejected.includes(x.id))   return false;      // 이미 버림
    if(seen.has(x.id)) return false;                 // 여러 학생이 같은 문제를 받은 경우
    seen.add(x.id); return true;
  }).sort((a,b)=>b.at-a.at);

  const card = (x, kind) => `
    <div class="q-expect" data-id="${escAttr(x.id)}" data-kind="${kind}" style="margin-bottom:12px">
      <b>${kind==='bank'?'승인됨':'검토 대기'} · ${esc(x.nb||'')}${x.by?' · '+esc(x.by)+' 풀이 중 생성':''}</b>
      <div style="margin:8px 0">
        <label class="tiny">문제</label>
        <textarea class="field es-q" rows="3" style="width:100%">${esc(x.question)}</textarea>
      </div>
      ${x.code?`<div style="margin:8px 0"><label class="tiny">코드</label>
        <textarea class="field es-c" rows="3" style="width:100%;font-family:var(--f-mono)">${esc(x.code)}</textarea></div>`:''}
      <div style="margin:8px 0">
        <label class="tiny">채점 기준</label>
        <textarea class="field es-r" rows="2" style="width:100%">${esc(x.rubric)}</textarea>
      </div>
      <div style="margin:8px 0">
        <label class="tiny">모범 답안</label>
        <textarea class="field es-a" rows="2" style="width:100%">${esc(x.answer)}</textarea>
      </div>
      <div class="toolbar">
        ${kind==='draft'
          ? `<button class="btn btn-sm" data-act="approve">승인하고 저장</button>
             <button class="btn btn-sm btn-ghost" data-act="reject">버리기</button>`
          : `<button class="btn btn-sm" data-act="save">수정 저장</button>
             <button class="btn btn-sm btn-ghost" data-act="remove">은행에서 빼기</button>`}
      </div>
    </div>`;

  body.innerHTML = `
    <h3 style="margin:18px 0 10px">검토 대기 ${drafts.length}건</h3>
    ${drafts.length?drafts.map(x=>card(x,'draft')).join(''):'<div class="empty">새로 만들어진 문제가 없습니다.</div>'}
    <h3 style="margin:26px 0 10px">승인된 문제 ${bank.length}건</h3>
    ${bank.length?bank.map(x=>card(x,'bank')).join(''):'<div class="empty">아직 승인한 문제가 없습니다.</div>'}`;

  const readCard = el => ({
    question: el.querySelector('.es-q').value.trim(),
    code:     el.querySelector('.es-c')?.value ?? '',
    rubric:   el.querySelector('.es-r').value.trim(),
    answer:   el.querySelector('.es-a').value.trim(),
  });

  body.onclick = async e => {
    const btn=e.target.closest('[data-act]'); if(!btn) return;
    const el=e.target.closest('[data-id]');
    const id=el.dataset.id, kind=el.dataset.kind, act=btn.dataset.act;
    const src = kind==='draft' ? drafts.find(x=>x.id===id) : bank.find(x=>x.id===id);
    if(!src) return;
    const edited = readCard(el);
    if(!edited.question){ return toast('문제 내용이 비어 있습니다'); }

    if(act==='approve'){
      essayBank().push({id, nb:src.nb, intro:src.intro||'', at:Date.now(), ...edited});
      await saveShared(); toast('승인했습니다'); return viewEssayAdmin();
    }
    if(act==='reject'){
      essayRejected().push(id);
      await saveShared(); toast('버렸습니다'); return viewEssayAdmin();
    }
    if(act==='save'){
      Object.assign(src, edited);
      await saveShared(); toast('저장했습니다'); return;
    }
    if(act==='remove'){
      const i=essayBank().findIndex(x=>x.id===id);
      if(i>=0) essayBank().splice(i,1);
      essayRejected().push(id);
      await saveShared(); toast('은행에서 뺐습니다'); return viewEssayAdmin();
    }
  };
}

/* ════════════════════════════════════════════════════════
   AI 질문 — 선택한 텍스트/셀에 대해 묻고 대화. 기록은 내 userdata 에 남습니다.
   ════════════════════════════════════════════════════════ */
let CHAT = null;

/* 선택 → 떠 있는 버튼. 라이브러리 없이 브라우저 기본 Selection 만 씁니다. */
const askFab = Object.assign(document.createElement('button'),
  {id:'ask-fab', className:'btn btn-primary', textContent:'AI에게 질문'});
document.body.appendChild(askFab);
askFab.onmousedown = e => e.preventDefault();          // 눌러도 선택이 풀리지 않게
askFab.onclick = () => { askFab.style.display='none'; askAI(askFab._sel, '선택한 부분'); };

function selCheck(){
  const sel = window.getSelection();
  const t = sel && String(sel).trim();
  const host = $('#view');
  if(!t || t.length < 2 || !host || !sel.anchorNode || !host.contains(sel.anchorNode)){
    askFab.style.display='none'; return;
  }
  const r = sel.getRangeAt(0).getBoundingClientRect();
  askFab._sel = t;
  askFab.style.display = 'block';
  askFab.style.left = Math.max(8, Math.min(innerWidth-130, r.left+scrollX)) + 'px';
  askFab.style.top  = (r.bottom + scrollY + 8) + 'px';
}
document.addEventListener('mouseup',  ()=>setTimeout(selCheck, 0));
document.addEventListener('touchend', ()=>setTimeout(selCheck, 80));
document.addEventListener('scroll',   ()=>askFab.style.display='none', true);

function askAI(context, label){
  if(!hasWorker()) return toast('AI 질문은 서버 연결이 필요합니다');
  if(readOnly())   return toast('읽기 전용입니다. 내 화면에서만 질문할 수 있습니다');
  context = String(context||'').trim().slice(0, 3000);
  if(!context) return toast('질문할 부분을 먼저 골라 주세요');

  CHAT = {id:Date.now().toString(36), at:new Date().toISOString(),
          nb:S.nb?.path||S.pdf?.path||null, label, context, msgs:[]};

  const m = modal(`
    <h3>AI에게 질문</h3>
    <div class="sub">${esc(label)}${CHAT.nb?' · '+esc(CHAT.nb.split('/').pop()):''} — 이 대화가 길어지면 내 지갑이 거덜납니다.</div>
    <div class="q-code" style="max-height:120px;overflow:auto"><pre>${esc(context)}</pre></div>
    <div class="ch-log" id="ch-log"></div>
    <textarea class="field" id="ch-in" rows="2" placeholder="이 부분에 대해 무엇이 궁금한가요? (Ctrl+Enter 로 보내기)"></textarea>
    <div class="row" style="justify-content:flex-start">
      <button class="btn btn-primary" id="ch-send">보내기</button>
      <button class="btn btn-ghost btn-sm" id="ch-close">닫기</button>
      <span class="tiny" id="ch-left" style="margin-left:auto"></span>
    </div>`);
  $('#ch-close').onclick = m.close;
  $('#ch-send').onclick  = chatSend;
  $('#ch-in').addEventListener('keydown', e=>{
    if(e.key==='Enter' && (e.ctrlKey||e.metaKey)){ e.preventDefault(); chatSend(); }
  });
  drawChat();
  $('#ch-in').focus();
}

const CHAT_MAX = 8;   // ponytail: 대화당 질문 한도. 요금 상한이 필요하면 이 숫자만 줄이면 됩니다.

function drawChat(){
  const log = $('#ch-log'); if(!log) return;
  log.innerHTML = CHAT.msgs.map(x => x.role==='user'
    ? `<div class="ch-msg ch-me">${esc(x.content)}</div>`
    : `<div class="ch-msg ch-ai">${renderMd(x.content)}</div>`).join('')
    || `<div class="tiny">고른 부분에 대해 물어보세요.</div>`;
  log.scrollTop = log.scrollHeight;
  typesetMath(log);
  const used = CHAT.msgs.filter(x=>x.role==='user').length;
  $('#ch-left').textContent = `${used}/${CHAT_MAX}`;
}

async function chatSend(){
  const inp = $('#ch-in'), q = inp.value.trim();
  if(!q) return;
  if(CHAT.msgs.filter(x=>x.role==='user').length >= CHAT_MAX)
    return toast(`한 대화에서 ${CHAT_MAX}번까지 물어볼 수 있습니다. 다시 선택해서 새 대화를 여세요`);

  CHAT.msgs.push({role:'user', content:q});
  inp.value = ''; drawChat();
  const btn = $('#ch-send'); btn.disabled = true; btn.textContent = '답하는 중…';
  try{
    const j = await api('/ai', {task:'chat', context:CHAT.context, messages:CHAT.msgs});
    CHAT.msgs.push({role:'assistant', content:j.text || '(빈 응답)'});
  }catch(e){
    CHAT.msgs.push({role:'assistant', content:'⚠ 응답 실패: ' + e.message});
  }
  btn.disabled = false; btn.textContent = '보내기';
  drawChat(); saveChat();
}

function saveChat(){
  if(readOnly()) return;
  S.data.chats = S.data.chats || [];
  const rec = {...CHAT, context:CHAT.context.slice(0,1200)};
  const i = S.data.chats.findIndex(c => c.id === CHAT.id);
  if(i < 0) S.data.chats.push(rec); else S.data.chats[i] = rec;
  // ponytail: 오래된 것부터 버림. 900KB 저장 한도에 걸리기 전에 자르면 그만입니다.
  if(S.data.chats.length > 60) S.data.chats.splice(0, S.data.chats.length - 60);
  persist();
}

function showChats(id, d){
  const cs = [...(d.chats||[])].reverse();
  const asks = cs.reduce((a,c)=>a + c.msgs.filter(x=>x.role==='user').length, 0);
  const m = modal(`
    <h3>${esc(id)} 님의 AI 대화</h3>
    <div class="sub">${cs.length ? `대화 ${cs.length}개 · 질문 ${asks}회` : 'AI에게 질문한 적이 없습니다.'}</div>
    <div style="max-height:56vh;overflow:auto">
      ${cs.map(c=>`<details style="margin-bottom:10px">
        <summary class="mono tiny" style="cursor:pointer">${new Date(c.at).toLocaleString('ko-KR')} · ${esc((c.nb||'—').split('/').pop())} · ${esc(c.label||'')} · ${c.msgs.filter(x=>x.role==='user').length}문</summary>
        <div class="q-code" style="margin:6px 0"><pre>${esc(String(c.context).slice(0,600))}</pre></div>

      </details>`).join('')}
    </div>
    <div class="row"><button class="btn btn-primary" id="cl-x">닫기</button></div>`);
  $('#cl-x').onclick = m.close;

async function renderPdfPages(path, host){
  const doc = await loadPdfDoc(path);
  host.innerHTML = '';
  const targetW = Math.max(320, Math.min(760, host.clientWidth || 760));
  for(let n=1; n<=doc.numPages; n++){
    const page = await doc.getPage(n);
    const base = page.getViewport({scale:1});
    const viewport = page.getViewport({scale: targetW / base.width});

    const wrap = document.createElement('div');
    wrap.className = 'pdf-page';
    wrap.style.width = viewport.width + 'px';
    wrap.style.height = viewport.height + 'px';

    const canvas = document.createElement('canvas');
    canvas.width = viewport.width; canvas.height = viewport.height;

    const textLayerDiv = document.createElement('div');
    textLayerDiv.className = 'textLayer';
    textLayerDiv.style.width = viewport.width + 'px';
    textLayerDiv.style.height = viewport.height + 'px';

    wrap.appendChild(canvas);
    wrap.appendChild(textLayerDiv);
    host.appendChild(wrap);

    await page.render({canvasContext: canvas.getContext('2d'), viewport}).promise;
    const textContent = await page.getTextContent();
    await pdfjsLib.renderTextLayer({
      textContentSource: textContent,
      container: textLayerDiv,
      viewport,
      textDivs: []
    }).promise;
  }
}

/* ════════════════════════════════════════════════════════
   라우팅 / 부팅
   ════════════════════════════════════════════════════════ */
function markNav(){
  $$('.nav-item').forEach(b=>b.classList.toggle('active',
    (b.dataset.view && (b.dataset.view===S.view || (b.dataset.view==='pdfs' && S.view==='pdf')))
    || (b.dataset.path && S.view==='nb' && b.dataset.path===S.nb?.path)));
}
function viewHome(){
  const nbs = S.notebooks || [];
  $('#view').innerHTML=`
    <div class="page-head">
      <div class="eyebrow">Workbench</div>
      <h2>${esc(S.me?.id||'')} 님, 안녕하세요</h2>
      <div class="sub">왼쪽에서 노트북을 고르거나, 아래에서 바로 시작하세요.</div>
    </div>
    <div class="home-sec">
      <h3>노트북</h3>
      ${nbs.length
        ? `<div class="home-grid">${nbs.map(n=>
            `<button class="home-card" data-go-nb="${escAttr(n.path)}">
               <div class="t">${esc(n.name)}</div>
               <div class="d">읽고 실행해 보기</div>
             </button>`).join('')}</div>`
        : `<div class="empty"><div class="eyebrow">No notebooks</div>
            <span class="mono">${esc(CONFIG.NOTEBOOK_DIR)}/</span> 폴더에 <span class="mono">.ipynb</span> 파일을 올려 주세요.</div>`}
    </div>
    <div class="home-sec">
      <h3>학습</h3>
      <div class="home-grid">
        <button class="home-card" data-go="quiz"><div class="t">문제 풀기</div><div class="d">노트북 내용으로 문제를 만들어 풉니다</div></button>
        <button class="home-card" data-go="wrong"><div class="t">오답 노트</div><div class="d">틀린 문제를 모아서 다시 봅니다</div></button>
        <button class="home-card" data-go="stats"><div class="t">진행 상황</div><div class="d">지금까지 푼 기록을 확인합니다</div></button>
      </div>
    </div>`;
  $('#view').onclick=e=>{
    const nb=e.target.closest('[data-go-nb]'); if(nb) return openNotebook(nb.dataset.goNb);
    const go=e.target.closest('[data-go]');    if(go) return setView(go.dataset.go);
  };
}
function setView(v,opts){
  S.view=v; markNav(); window.scrollTo(0,0);
  $('#view').onclick=null;
  if(window.innerWidth<=860) $('#side').classList.add('closed');
  if(v==='home')  return viewHome();
  if(v==='quiz')  return viewQuiz(opts);
  if(v==='wrong') return viewWrong();
  if(v==='stats') return viewStats();
  if(v==='admin') return viewAdmin();
  if(v==='essay') return viewEssayAdmin();
  if(v==='nb')    return viewNotebook();
  if(v==='pdfs')  return viewPdfList();
  if(v==='pdf')   return viewPdf();
}
async function openNotebook(path){
  const meta=S.notebooks.find(n=>n.path===path); if(!meta) return;
  $('#view').innerHTML=`<div class="empty">불러오는 중…</div>`;
  try{
    const cells=await fetchNotebook(path);
    S.nb={path,name:meta.name,cells};
    QZ=null; setView('nb');
  }catch(e){ $('#view').innerHTML=`<div class="empty"><div class="eyebrow">Error</div>${esc(e.message)}</div>`; }
}

async function start(me){
  S.me=me;
  $('#login').classList.add('hidden');
  $('#app').classList.remove('hidden');
  $('#user-chip').innerHTML=`<span class="mono">${esc(me.id)}</span>`;
  if(me.admin){ $('#user-chip').classList.add('admin'); $('#admin-sec').classList.remove('hidden'); }

  S.myData = await Store.load(me.id);
  S.data = S.myData;
  S.shared = await Store.load('_shared');
  S.adminGlobal=false;
  updateWrongDot();

  try{
    S.notebooks = await fetchNotebookList();
    $('#nb-list').innerHTML = S.notebooks.length
      ? S.notebooks.map((n,i)=>`<button class="nav-item" data-path="${escAttr(n.path)}"><span class="nav-n">${String(i+1).padStart(2,'0')}</span>${esc(n.name)}</button>`).join('')
      : `<div class="tiny" style="padding:6px 9px">노트북이 없습니다. <span class="mono">${esc(CONFIG.NOTEBOOK_DIR)}/</span> 폴더에 .ipynb 파일을 올려 주세요.</div>`;
  }catch(e){
    $('#nb-list').innerHTML=`<div class="tiny" style="padding:6px 9px;color:var(--bad)">${esc(e.message)}</div>`;
  }

  $('#nb-list').onclick=e=>{ const b=e.target.closest('[data-path]'); if(b) openNotebook(b.dataset.path); };
  $$('.nav-item[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));
  setView('home');
}

$('#logout').onclick=()=>{ localStorage.removeItem('cnb:auto'); location.reload(); };
$('#chpw').onclick=openChangePw;
$('#imp-exit').onclick=exitImpersonate;
$('#menu-btn').onclick=()=>$('#side').classList.toggle('closed');
$('#go-home').onclick=()=>setView('home');

(async function boot(){
  bindLogin();
  marked.setOptions({breaks:true,gfm:true});
  try{
    const auto=JSON.parse(localStorage.getItem('cnb:auto'));
    if(auto?.id){ await start(auto); return; }
  }catch{}
  $('#lg-id').focus();
})();
</script>
</body>
</html>
